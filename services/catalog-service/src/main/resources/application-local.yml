# Ativado só com SPRING_PROFILES_ACTIVE=local (ver docker-compose.yml).
# Único lugar do serviço com credenciais de teste e endpoint apontando para o
# MiniStack — nenhuma dessas chaves existe no application.yml "de produção".
# Trocar de emulação para AWS real é não ativar este profile, não editar nada
# aqui dentro.
spring:
  cloud:
    aws:
      credentials:
        access-key: test
        secret-key: test
      dynamodb:
        endpoint: http://ministack:4566
      s3:
        endpoint: http://ministack:4566
        # Necessário só contra o emulador: a AWS real resolve bucket via
        # virtual-hosted-style (subdomínio), o MiniStack via path.
        path-style-access-enabled: true
