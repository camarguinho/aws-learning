server:
  port: 8081

spring:
  application:
    name: catalog-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    aws:
      region:
        static: ${AWS_REGION:us-east-1}
      # Nenhuma chave "credentials" nem "endpoint" aqui: o SDK usa a default
      # credential provider chain (role do ECS/EC2/IRSA) e resolve os
      # endpoints reais da AWS pela região. Essas chaves só existem no
      # profile "local" (application-local.yml) — ver PILOTO-MINISTACK.md.
      dynamodb:
        # A tabela é resolvida pelo Spring Cloud AWS a partir do nome da
        # classe (@DynamoDbBean em Product.java -> "product"). table-prefix/
        # table-suffix são o gancho oficial pra variar isso por ambiente
        # (ex.: "prod_product") sem editar código Java.
        table-prefix: ${DYNAMODB_TABLE_PREFIX:}
        table-suffix: ${DYNAMODB_TABLE_SUFFIX:}

app:
  s3:
    # Nome do bucket real na AWS: bucket S3 é único MUNDIALMENTE, então
    # "ecommerce-product-images" quase certamente precisa virar outra coisa
    # em produção — sobrescrever via PRODUCT_IMAGES_BUCKET_NAME.
    product-images-bucket: ${PRODUCT_IMAGES_BUCKET_NAME:ecommerce-product-images}
  cache:
    products-ttl-seconds: 300

resilience4j:
  circuitbreaker:
    instances:
      s3:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
  retry:
    instances:
      s3:
        max-attempts: 3
        wait-duration: 200ms

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    br.com.camarguinho.awslearning: INFO
