server:
  port: 8082

spring:
  application:
    name: order-service
  # Importa, em tempo de bootstrap, os segredos do RDS a partir do Secrets
  # Manager e os parâmetros de configuração do SSM Parameter Store. As chaves
  # do JSON do segredo (username/password) e o nome do parâmetro (db-url)
  # viram properties comuns, usadas logo abaixo em spring.datasource.*.
  # Nome do segredo/caminho do parâmetro parametrizados: em produção, apontar
  # para o que o Terraform/CDK/CloudFormation real criou, via
  # ORDER_SERVICE_DB_SECRET_NAME / ORDER_SERVICE_PARAMETER_PATH — placeholder
  # resolvido cedo o bastante (mesma fase do spring.config.import) porque vem
  # de variável de ambiente, não de application-local.yml.
  config:
    import:
      - aws-secretsmanager:${ORDER_SERVICE_DB_SECRET_NAME:/ecommerce/order-service/db-credentials}
      - aws-parameterstore:${ORDER_SERVICE_PARAMETER_PATH:/ecommerce/order-service/}
  datasource:
    # sslmode default "disable" preserva o Postgres local (sem TLS); RDS real
    # normalmente exige TLS — setar DB_SSL_MODE=require (ou verify-full com
    # o certificado da AWS) só na hora da virada, via env var.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/orders?sslmode=${DB_SSL_MODE:disable}
    username: ${username}
    password: ${password}
  jpa:
    hibernate:
      # ddl-auto=update é aceitável apenas neste projeto de estudo. Em produção,
      # use uma ferramenta de migração versionada (Flyway/Liquibase) — ver
      # capítulo de boas práticas do ebook.
      ddl-auto: update
    open-in-view: false
  cloud:
    aws:
      region:
        static: ${AWS_REGION:us-east-1}
      # Nenhuma chave "credentials" nem "endpoint" aqui — ver
      # application-local.yml e PILOTO-MINISTACK.md.

app:
  catalog-service:
    base-url: ${CATALOG_SERVICE_URL:http://localhost:8081}
  sns:
    # Nome do tópico real na AWS pode ser diferente do usado no MiniStack —
    # sobrescrever via ORDER_NOTIFICATIONS_TOPIC_NAME.
    order-notifications-topic: ${ORDER_NOTIFICATIONS_TOPIC_NAME:order-notifications-topic}

resilience4j:
  circuitbreaker:
    instances:
      catalog-service:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
  retry:
    instances:
      catalog-service:
        max-attempts: 3
        wait-duration: 200ms
  bulkhead:
    instances:
      catalog-service:
        max-concurrent-calls: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    br.com.camarguinho.awslearning: INFO
