server:
  port: 8083

spring:
  application:
    name: notification-service
  cloud:
    aws:
      region:
        static: ${AWS_REGION:us-east-1}
      ses:
        region: ${AWS_REGION:us-east-1}
      # Nenhuma chave "credentials" nem "endpoint" aqui — ver
      # application-local.yml e PILOTO-MINISTACK.md.

app:
  ses:
    # Em produção precisa ser um remetente VERIFICADO no SES (sandbox por
    # padrão) — sobrescrever via SES_FROM_ADDRESS.
    from-address: ${SES_FROM_ADDRESS:no-reply@ecommerce.example.com}
  sqs:
    # Nome real da fila pode diferir do usado no MiniStack — sobrescrever via
    # ORDER_EVENTS_QUEUE_NAME. Consumido em OrderEventListener via
    # @SqsListener("${app.sqs.order-events-queue-name}").
    order-events-queue-name: ${ORDER_EVENTS_QUEUE_NAME:order-events-queue}

resilience4j:
  retry:
    instances:
      ses:
        max-attempts: 3
        wait-duration: 300ms

# Publica métricas do Micrometer no CloudWatch a cada 1 minuto, no namespace
# "EcommerceAwsLearning". Em produção, prefira um intervalo maior (ex.: 5 min)
# para reduzir custo de API (CloudWatch cobra por chamada PutMetricData).
management:
  cloudwatch:
    metrics:
      export:
        namespace: EcommerceAwsLearning
        step: 1m
        enabled: ${CLOUDWATCH_METRICS_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    br.com.camarguinho.awslearning: INFO
