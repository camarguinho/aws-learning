# Infraestrutura local que emula os serviços AWS usados pelo case de e-commerce.
# Nada precisa ser instalado na máquina além do Docker: `docker compose up -d`.
#
# - MiniStack   -> emulador AWS local, edge port único (ver PILOTO-MINISTACK.md)
#                  para S3, DynamoDB, SQS, SNS, Secrets Manager, SSM Parameter
#                  Store, SES e CloudWatch.
# - PostgreSQL  -> emula o Amazon RDS (PostgreSQL engine) usado pelo order-service.
# - Redis       -> emula o Amazon ElastiCache (Redis) usado pelo catalog-service.
#
# Os 3 microsserviços sobem com o profile Spring "local" (SPRING_PROFILES_ACTIVE
# abaixo) — é ele, e só ele, que ativa credenciais de teste e o endpoint do
# MiniStack (application-local.yml, em cada serviço). O application.yml
# "de produção" de cada serviço não tem endpoint nem credentials: o SDK usa a
# default credential provider chain e os endpoints reais da AWS. Ver
# PILOTO-MINISTACK.md para o racional completo e os pontos de fricção da troca.
services:

  ministack:
    # TODO(piloto): fixar uma tag de versão específica assim que a suíte de
    # testes for validada contra ela (ver PILOTO-MINISTACK.md).
    image: ministackorg/ministack:latest
    container_name: aws-learning-ministack
    ports:
      - "4566:4566"       # Edge port único para todas as APIs AWS emuladas
    environment:
      - AWS_DEFAULT_REGION=us-east-1
      # O MiniStack habilita os 60+ serviços por padrão — não existe (nem é
      # preciso) um equivalente à variável SERVICES do LocalStack.
      # Estado é volátil por padrão (tudo em memória). PERSIST_STATE/STATE_DIR
      # e S3_PERSIST/S3_DATA_DIR habilitam persistência em disco no volume
      # nomeado abaixo — os diretórios precisam ser explicitados porque os
      # defaults do MiniStack (/tmp/ministack-state, /tmp/ministack-data/s3)
      # ficam fora de qualquer volume montado.
      - PERSIST_STATE=1
      - STATE_DIR=/data/state
      - S3_PERSIST=1
      - S3_DATA_DIR=/data/s3
    volumes:
      # Hook "ready.d" nativo do MiniStack: roda o script de provisionamento
      # dentro do próprio container, assim que a API fica pronta para receber
      # requisições — sem precisar de um container auxiliar. O healthcheck só
      # fica "healthy" depois que os scripts deste diretório terminam.
      - "./infra/ministack/init:/docker-entrypoint-initaws.d/ready.d:ro"
      - "ministack-data:/data"
      - "/var/run/docker.sock:/var/run/docker.sock"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_ministack/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:16-alpine
    container_name: aws-learning-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=orders_app
      - POSTGRES_PASSWORD=orders_app_pwd
      - POSTGRES_DB=orders
    volumes:
      - "postgres-data:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders_app -d orders"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: aws-learning-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  catalog-service:
    build:
      context: .
      dockerfile: services/catalog-service/Dockerfile
    container_name: aws-learning-catalog-service
    ports:
      - "8081:8081"
    environment:
      # Único gatilho da emulação: ativa application-local.yml (credenciais de
      # teste + endpoint do MiniStack). Ausente = profile de produção.
      - SPRING_PROFILES_ACTIVE=local
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      ministack:
        condition: service_healthy
      redis:
        condition: service_healthy

  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    container_name: aws-learning-order-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - DB_HOST=postgres
      - DB_PORT=5432
      - CATALOG_SERVICE_URL=http://catalog-service:8081
    depends_on:
      ministack:
        condition: service_healthy
      postgres:
        condition: service_healthy
      catalog-service:
        condition: service_started

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: aws-learning-notification-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=local
    depends_on:
      ministack:
        condition: service_healthy

volumes:
  ministack-data:
  postgres-data:
