# Infraestrutura local que emula os serviços AWS usados pelo case de e-commerce.
# Nada precisa ser instalado na máquina além do Docker: `docker compose up -d`.
#
# >>> PILOTO: esta branch troca o LocalStack pelo MiniStack <<<
# Motivo: a partir de 23/03/2026 a LocalStack arquivou a edição Community
# (Apache 2.0) e passou a exigir conta + token, com o plano gratuito ("Hobby")
# restrito a uso NÃO-COMERCIAL — o que inviabiliza usar a imagem oficial numa
# empresa sem licença paga. O MiniStack é um emulador AWS local independente,
# escrito do zero, MIT, sem conta/token — escuta na mesma porta (4566) e fala
# a mesma API, então a troca abaixo é só a imagem: nenhuma linha do Spring
# Cloud AWS nos serviços mudou.
#
# - MiniStack   -> emula S3, DynamoDB, SQS, SNS, Secrets Manager, SSM Parameter Store,
#                  SES e CloudWatch.
# - PostgreSQL  -> emula o Amazon RDS (PostgreSQL engine) usado pelo order-service.
# - Redis       -> emula o Amazon ElastiCache (Redis) usado pelo catalog-service.
services:

  ministack:
    # TODO(piloto): fixar uma tag de versão específica assim que a suíte de
    # testes for validada contra ela. Ver PILOTO-MINISTACK.md.
    image: ministackorg/ministack:latest
    container_name: aws-learning-ministack
    ports:
      - "4566:4566"       # Edge port único para todas as APIs AWS emuladas
    environment:
      - AWS_DEFAULT_REGION=us-east-1
      # Ao contrário do LocalStack, o MiniStack não parece exigir uma lista
      # explícita de serviços habilitados (SERVICES=...) — os 60+ serviços
      # já vêm ativos por padrão. Validar no piloto se PERSISTENCE de dados
      # entre restarts precisa de alguma flag equivalente.
    volumes:
      - "ministack-data:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_ministack/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Provisiona os recursos AWS (bucket, tabela, filas, tópico, segredo,
  # parâmetros) rodando o script uma única vez, de fora do container do
  # emulador — não depende de nenhum hook interno específico do MiniStack,
  # só da API AWS padrão exposta na porta 4566.
  init:
    image: amazon/aws-cli:2.17.62
    container_name: aws-learning-ministack-init
    entrypoint: ["/bin/sh", "/init/init-aws.sh"]
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - "./infra/ministack/init/init-aws.sh:/init/init-aws.sh:ro"
    depends_on:
      ministack:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: aws-learning-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=orders_app
      - POSTGRES_PASSWORD=orders_app_pwd
      - POSTGRES_DB=orders
    volumes:
      - "postgres-data:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders_app -d orders"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: aws-learning-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  catalog-service:
    build:
      context: .
      dockerfile: services/catalog-service/Dockerfile
    container_name: aws-learning-catalog-service
    ports:
      - "8081:8081"
    environment:
      - AWS_ENDPOINT_URL=http://ministack:4566
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      ministack:
        condition: service_healthy
      init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    container_name: aws-learning-order-service
    ports:
      - "8082:8082"
    environment:
      - AWS_ENDPOINT_URL=http://ministack:4566
      - DB_HOST=postgres
      - DB_PORT=5432
      - CATALOG_SERVICE_URL=http://catalog-service:8081
    depends_on:
      ministack:
        condition: service_healthy
      init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      catalog-service:
        condition: service_started

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: aws-learning-notification-service
    ports:
      - "8083:8083"
    environment:
      - AWS_ENDPOINT_URL=http://ministack:4566
    depends_on:
      ministack:
        condition: service_healthy
      init:
        condition: service_completed_successfully

volumes:
  ministack-data:
  postgres-data:
